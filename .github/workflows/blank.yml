name: Build Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect and Unzip
        run: |
          pwd
          ls -la
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d extracted || true
            cp -r extracted/*/. . 2>/dev/null || cp -r extracted/. . 2>/dev/null || true
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || npm install --force

      - name: Run Build
        run: |
          npm run build || npm run pack || npm run build-ff || npm run pack-ff || true

      - name: Create Zip Package
        run: |
          zip -r compiled-extension.zip . -x "node_modules/*" ".git/*" ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-extension
          path: compiled-extension.zip
