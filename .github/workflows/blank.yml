name: Build Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unzip source archive and move files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
            subfolder=$(find . -mindepth 2 -name "package.json" -exec dirname {} \;)
            if [ -n "$subfolder" ]; then
              cp -rn $subfolder/* .
            fi
          fi

      - name: Install dependencies & Build
        run: |
          npm ci || npm install
          npm run pack-ff || npm run pack || npm run build-ff || npm run build || true

      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: compiled-extension
          path: |
            *.zip
            dist/
            build/
